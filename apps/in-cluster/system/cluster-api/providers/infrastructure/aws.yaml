apiVersion: v1
kind: Namespace
metadata:
  name: capa-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aws-variables
  namespace: capa-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: aws-variables
  data:
    - secretKey: AWS_B64ENCODED_CREDENTIALS
      remoteRef:
        key: clusters/aws
        property: b64-credentials
---
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: InfrastructureProvider
metadata:
  name: aws
  namespace: capa-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  version: v2.13.0
  configSecret:
    name: aws-variables
