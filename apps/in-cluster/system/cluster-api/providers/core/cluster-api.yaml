apiVersion: v1
kind: Namespace
metadata:
  name: capi-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: CoreProvider
metadata:
  name: cluster-api
  namespace: capi-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  version: v1.13.4
  manager:
    featureGates:
      ClusterTopology: true
