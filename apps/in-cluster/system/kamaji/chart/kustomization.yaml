apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  # 0.0.0+latest is the only chart version CLASTIX publishes for the OSS build;
  # the last semver chart (1.0.0) predates the fields the v0.20.0 CAPI provider
  # sets. The image is pinned in values.yaml instead.
  #
  # apiVersions is load-bearing: the chart gates its ServiceMonitor on
  # .Capabilities.APIVersions, and the list replaces helm's defaults.
  - name: kamaji
    repo: https://clastix.github.io/charts
    version: 0.0.0+latest
    releaseName: kamaji
    namespace: kamaji-system
    valuesFile: values.yaml
    includeCRDs: true
    apiVersions:
      - v1
      - monitoring.coreos.com/v1

patches:
  - path: patch-crd.yaml
