apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulwark-brand
  labels:
    app.kubernetes.io/name: bulwark-brand
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bulwark-brand
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bulwark-brand
    spec:
      # nginx-unprivileged listens on 8080 and runs as uid 101, so no root and no
      # NET_BIND_SERVICE needed.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.29-alpine
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /brand/icon.svg
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            # Served at /brand/* so the ingress can use a plain prefix match
            # with no rewrite rule.
            - name: assets
              mountPath: /usr/share/nginx/html/brand
              readOnly: true
            # readOnlyRootFilesystem: nginx needs these writable.
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /tmp
      volumes:
        - name: assets
          configMap:
            name: bulwark-brand
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
