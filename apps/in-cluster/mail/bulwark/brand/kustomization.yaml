apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Matches the chart's namespace, without which the generated ConfigMap's hashed
# name is not substituted into the Deployment.
namespace: bulwark

resources:
  - chart

# Hash-suffixed, so editing an SVG rolls the Deployment.
configMapGenerator:
  - name: bulwark-brand
    files:
      - icon.svg=logos/icon.svg
      - logo-light.svg=logos/logo-light.svg
      - logo-dark.svg=logos/logo-dark.svg
