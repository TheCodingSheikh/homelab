apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Hash-suffixed, so editing an SVG rolls the Deployment automatically.
configMapGenerator:
  - name: bulwark-brand
    files:
      - icon.svg
      - logo-light.svg
      - logo-dark.svg
