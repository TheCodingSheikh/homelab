# Bulwark is the JMAP webmail front-end for the Stalwart server deployed in
# apps/in-cluster/mail/stalwart/.

# settingsSync below is backed by a ReadWriteOnce PVC, which pins this to a
# single replica. Drop persistence to go back to the chart default of 2.
replicaCount: 1

podAnnotations:
  # Mount the lab CA — Stalwart is served from the self-signed lab-issuer.
  inject-certs: "enabled"

config:
  # Exposed verbatim to the browser via /api/config: the client fetches
  # `${jmapServerUrl}/.well-known/jmap` itself, so this has to be the public
  # hostname rather than a cluster-internal Service name. The matching CORS
  # annotations live on the Stalwart ingress.
  jmapServerUrl: "https://mail.lab.com"
  hostname: "0.0.0.0"
  port: 3000

  # ---------------------------------------------------------------------------
  # Branding
  # ---------------------------------------------------------------------------
  # Assets are served from the same origin by the `brand` overlay
  # (apps/in-cluster/mail/bulwark/brand/), so they are covered by the existing
  # TLS cert and need no CORS. Same-origin also matters for the PWA manifest,
  # which browsers will not load icons cross-origin for.
  appName: "Lab Mail"
  appShortName: "LabMail"
  appDescription: "Mail, calendar and contacts for lab.com"

  faviconUrl: "https://webmail.lab.com/brand/icon.svg"
  pwaIconUrl: "https://webmail.lab.com/brand/icon.svg"
  pwaThemeColor: "#1f2d3d"
  pwaBackgroundColor: "#0d1117"

  appLogoLightUrl: "https://webmail.lab.com/brand/logo-light.svg"
  appLogoDarkUrl: "https://webmail.lab.com/brand/logo-dark.svg"
  loginLogoLightUrl: "https://webmail.lab.com/brand/logo-light.svg"
  loginLogoDarkUrl: "https://webmail.lab.com/brand/logo-dark.svg"

  loginCompanyName: "Lab"
  loginWebsiteUrl: "https://home.lab.com"

  # Password change and Sieve filter management via Stalwart's own APIs.
  stalwartFeatures: true
  allowCustomJmapEndpoint: false
  logLevel: "info"

extraEnv:
  - name: NODE_EXTRA_CA_CERTS
    value: /etc/ssl/certs/ca.crt

  # Chart 0.2.2 templates OAUTH_ENABLED/CLIENT_ID/ISSUER_URL/CLIENT_SECRET_FILE
  # from the `oidc:` block below, but not these three.

  # Removes the username/password form so Keycloak is the only way in.
  - name: OAUTH_ONLY
    value: "true"
  # Starts the OAuth flow on page load, so there is no "Sign in with SSO" button
  # to click. Upstream requires OAUTH_ENABLED and OAUTH_ONLY for this to apply.
  - name: AUTO_SSO_ENABLED
    value: "true"
  # Stalwart's OIDC directory sets requireScopes {openid, email, profile} and
  # rejects any token missing one. `profile` is what backs claimName, and it is
  # not obviously part of Bulwark's built-in scope set — appended rather than
  # overriding OAUTH_SCOPES so the JMAP scopes it needs stay intact.
  - name: OAUTH_EXTRA_SCOPES
    value: "profile"

# -----------------------------------------------------------------------------
# OIDC / SSO
# -----------------------------------------------------------------------------
# Both halves of the flow are declared in git:
#   - the Keycloak client (plus the `stalwart` audience mapper that makes the
#     token acceptable to Stalwart) in
#     apps/in-cluster/platform/keycloak/iac/chart/values.yaml
#   - Stalwart's OIDC directory, in
#     apps/in-cluster/mail/stalwart/iac/plan.ndjson
#
# Bulwark obtains a token from Keycloak and presents it to Stalwart over JMAP;
# Stalwart validates it against that same realm. Both sides must agree, so if
# the Stalwart plan has not been applied yet, logins fail here.
oidc:
  enabled: true
  clientId: bulwark
  issuerUrl: "https://sso.lab.com/realms/lab"
  existingClientSecret: bulwark-oidc
  existingClientSecretKey: client-secret

# Cookie-encryption key. Without an existingSecret the chart generates one at
# install time, which Argo would then see drift against on every sync.
session:
  existingSecret: bulwark-secret
  existingSecretKey: session-secret

# Per-user preferences stored server-side. On emptyDir (the chart default) they
# reset whenever the pod restarts.
settingsSync:
  enabled: true
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 5Gi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: lab-issuer
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Bulwark"
    gethomepage.dev/description: "Webmail"
    gethomepage.dev/group: "Mail"
  hosts:
    - host: webmail.lab.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: bulwark-tls
      hosts:
        - webmail.lab.com

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
