# Pinned to 1 by the ReadWriteOnce settingsSync PVC below.
replicaCount: 1

podAnnotations:
  inject-certs: "enabled"

config:
  # Resolved by the browser, so it must be the public hostname.
  jmapServerUrl: "https://mail.lab.com"
  hostname: "0.0.0.0"
  port: 3000

  appName: "Lab Mail"
  appShortName: "LabMail"
  appDescription: "Mail, calendar and contacts for lab.com"

  # Same origin as the app: browsers refuse cross-origin PWA icons.
  faviconUrl: "https://webmail.lab.com/brand/icon.svg"
  pwaIconUrl: "https://webmail.lab.com/brand/icon.svg"
  pwaThemeColor: "#1f2d3d"
  pwaBackgroundColor: "#0d1117"

  appLogoLightUrl: "https://webmail.lab.com/brand/logo-light.svg"
  appLogoDarkUrl: "https://webmail.lab.com/brand/logo-dark.svg"
  loginLogoLightUrl: "https://webmail.lab.com/brand/logo-light.svg"
  loginLogoDarkUrl: "https://webmail.lab.com/brand/logo-dark.svg"

  loginCompanyName: "Lab"
  loginWebsiteUrl: "https://home.lab.com"

  stalwartFeatures: true
  allowCustomJmapEndpoint: false
  logLevel: "info"

extraEnv:
  # Node ignores /etc/ssl/certs, so without this OIDC discovery fails.
  - name: NODE_EXTRA_CA_CERTS
    value: /etc/ssl/certs/ca.crt
  - name: OAUTH_ONLY
    value: "true"
  - name: AUTO_SSO_ENABLED
    value: "true"
  # Required by Stalwart's directory; appended so Bulwark's JMAP scopes survive.
  - name: OAUTH_EXTRA_SCOPES
    value: "profile"

oidc:
  enabled: true
  clientId: bulwark
  issuerUrl: "https://sso.lab.com/realms/lab"
  existingClientSecret: bulwark-oidc
  existingClientSecretKey: client-secret

# Without existingSecret the chart generates one per install, which Argo then
# sees as drift on every sync.
session:
  existingSecret: bulwark-secret
  existingSecretKey: session-secret

settingsSync:
  enabled: true
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 5Gi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: lab-issuer
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Bulwark"
    gethomepage.dev/description: "Webmail"
    gethomepage.dev/group: "Mail"
  hosts:
    - host: webmail.lab.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: bulwark-tls
      hosts:
        - webmail.lab.com

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
