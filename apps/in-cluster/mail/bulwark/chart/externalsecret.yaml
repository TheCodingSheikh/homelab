apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bulwark-externalsecret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: bulwark-secret
  data:
    # Auto-generated by the PushSecret in pushsecret.yaml
    - secretKey: session-secret
      remoteRef:
        key: mail/bulwark/session-secret
        property: session-secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bulwark-oidc-externalsecret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: bulwark-oidc
  data:
    # Generated by the keycloak iac chart when it renders the `bulwark` client.
    - secretKey: client-secret
      remoteRef:
        key: platform/keycloak/clients/bulwark
        property: secret-key
