# Multi-replica needs a coordinator (redis/nats) to stay cache-coherent.
replicaCount: 1

image:
  repository: stalwartlabs/stalwart
  tag: "v0.16.15"

publicUrl: "https://mail.lab.com"

podAnnotations:
  inject-certs: "enabled"

# Referenced from iac/plan.yaml and resolved by the server at runtime, so the S3
# secret never reaches the config store or git.
extraEnv:
  - name: STALWART_S3_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: stalwart-s3
        key: secret-key

dataStore:
  type: postgres
  postgres:
    host: lab-primary.postgres-cluster.svc
    port: 5432
    database: stalwart
    username: stalwart
    existingSecret: stalwart-pg
    existingSecretKey: password

# The only way into a fresh web UI — bootstrap creates no admin Account.
# `enabled: true` is a separate emergency mode that unloads the web UI.
recovery:
  enabled: false
  adminUser: admin
  existingSecret: stalwart-admin
  existingSecretKey: password

# k3d maps only 80/443 and runs without a cloud controller, so the chart's
# default LoadBalancer would sit Pending. Mail ports are in-cluster only.
service:
  mail:
    type: ClusterIP
  http:
    type: ClusterIP
    port: 8080

listeners:
  smtp:
    enabled: true
    port: 25
  submission:
    enabled: true
    port: 587
  submissions:
    enabled: true
    port: 465
  imap:
    enabled: true
    port: 143
  imaps:
    enabled: true
    port: 993
  pop3:
    enabled: false
    port: 110
  pop3s:
    enabled: false
    port: 995
  managesieve:
    enabled: true
    port: 4190
  http:
    enabled: true
    port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: lab-issuer
    nginx.ingress.kubernetes.io/proxy-body-size: 256m
    # Stalwart answers Bulwark's credentialed cross-origin JMAP calls with
    # `Allow-Origin: *` and no `Allow-Credentials`, which browsers reject.
    # Dropping these breaks the webmail.
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://webmail.lab.com"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS, PATCH, PUT, DELETE, HEAD"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, Accept, X-Requested-With, Origin"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Stalwart"
    gethomepage.dev/description: "Mail & Collaboration Server"
    gethomepage.dev/group: "Mail"
  hosts:
    - host: mail.lab.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: stalwart-tls
      hosts:
        - mail.lab.com

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

# /metrics needs a bearer token that only exists post-bootstrap.
metrics:
  enabled: false
  serviceMonitor:
    enabled: false
