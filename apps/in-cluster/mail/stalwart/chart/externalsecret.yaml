apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stalwart-pg-externalsecret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: stalwart-pg
  # Written by the PushSecret the postgres `lab` cluster renders for each user.
  dataFrom:
    - extract:
        key: datastore/postgres/lab/stalwart
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stalwart-s3-externalsecret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: stalwart-s3
  # Generated by the seaweedfs chart's per-user PushSecret.
  data:
    - secretKey: access-key
      remoteRef:
        key: storage/seaweedfs/stalwart
        property: access-key
    - secretKey: secret-key
      remoteRef:
        key: storage/seaweedfs/stalwart
        property: secret-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stalwart-admin-externalsecret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: stalwart-admin
  data:
    # Auto-generated by the PushSecret in pushsecret.yaml
    - secretKey: password
      remoteRef:
        key: mail/stalwart/admin
        property: password
