apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stalwart-pg-externalsecret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: stalwart-pg
  # Written by the PushSecret the postgres `lab` cluster renders for each user.
  dataFrom:
    - extract:
        key: datastore/postgres/lab/stalwart
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stalwart-admin-externalsecret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: stalwart-admin
  data:
    # Auto-generated by the PushSecret in pushsecret.yaml
    - secretKey: password
      remoteRef:
        key: mail/stalwart/admin
        property: password
