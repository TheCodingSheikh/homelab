# Declarative Stalwart configuration.
#
# This is the source of truth. An initContainer converts it to the NDJSON that
# `stalwart-cli apply` expects — the CLI parses one JSON object per line
# (src/commands/apply.rs: `parse_ndjson_plan`), so the wire format cannot hold
# comments or line breaks. Authoring it as multi-document YAML keeps it legible.
#
# `apply` is idempotent: it reconciles live server state to this plan.

# -----------------------------------------------------------------------------
# 1. The mail domain
# -----------------------------------------------------------------------------
# dkimManagement Automatic → Stalwart generates and rotates the signing keys.
# dnsManagement Manual → MX/SPF/DMARC/DKIM records must be published by hand;
# read the generated zone file from the admin UI once this exists.
# certificateManagement Manual → ingress-nginx terminates TLS, not Stalwart.
"@type": upsert
object: Domain
matchOn:
  - name
value:
  dom-lab:
    name: lab.com
    description: Primary lab mail domain
    # `aliases` is omitted, not empty. It is a schema `set`, which serialises as
    # a map ({"other.com": true}) rather than an array — passing [] is what the
    # server rejected with `invalidPatch ... Properties: aliases`.
    certificateManagement:
      "@type": Manual
    dkimManagement:
      "@type": Automatic
    dnsManagement:
      "@type": Manual
    subAddressing:
      "@type": Enabled
    allowRelaying: false

---
# -----------------------------------------------------------------------------
# 2. Keycloak as an OIDC authentication backend
# -----------------------------------------------------------------------------
# requireAudience must match the audience injected by the `stalwart-audience`
# protocol mapper on the Keycloak `bulwark` client — Keycloak puts the client in
# `azp`, not `aud`, so without that mapper every login is rejected here.
#
# usernameDomain is appended when the claim has no `@`, so a Keycloak username
# of `abdo` becomes `abdo@lab.com`.
"@type": upsert
object: Directory
# Matches the server's own label property for x:Directory, so repeat applies
# update in place instead of creating duplicates. Stated explicitly rather than
# relying on the fallback.
matchOn:
  - description
value:
  dir-keycloak:
    "@type": Oidc
    description: Keycloak (lab realm)
    issuerUrl: https://sso.lab.com/realms/lab
    requireAudience: stalwart
    # Also a `set`, so this is a map of scope -> true, not a list. The server's
    # own default for this field is {"openid": true, "email": true}.
    requireScopes:
      openid: true
      email: true
      profile: true
    claimUsername: preferred_username
    usernameDomain: lab.com
    claimName: name
    claimGroups: groups

---
# -----------------------------------------------------------------------------
# 3. Activate SSO
# -----------------------------------------------------------------------------
# The single line that actually turns SSO on. `#dir-keycloak` refers to the
# object created above; `#<id>` references resolve within one plan.
#
# The STALWART_RECOVERY_ADMIN fallback keeps working after this, which is what
# prevents a lockout if Keycloak is ever unreachable.
"@type": update
object: Authentication
value:
  directoryId: "#dir-keycloak"

---
# -----------------------------------------------------------------------------
# 4. HTTP behaviour
# -----------------------------------------------------------------------------
# CORS is owned by the Stalwart ingress annotations. Setting it in both places
# emits duplicate Access-Control-Allow-Origin headers, which browsers reject, so
# this stays false deliberately.
#
# useXForwarded → trust the client IP that ingress-nginx forwards.
"@type": update
object: Http
value:
  usePermissiveCors: false
  useXForwarded: true

---
# -----------------------------------------------------------------------------
# 5. Blob store — message bodies and attachments on S3 (SeaweedFS)
# -----------------------------------------------------------------------------
# Without this every message body lives in Postgres, which makes the mail store
# grow without bound and turns backups into a problem. The bucket and the
# `stalwart` S3 user are declared in
# apps/in-cluster/storage/seaweedfs/chart/values.yaml.
#
# accessKey is a plain string in the schema, so it cannot reference a secret —
# `${STALWART_S3_ACCESS_KEY}` is substituted by yq at render time from the
# Job's env, which keeps it out of git. secretKey does support indirection, so
# it is resolved by the *server* from its own environment and never appears in
# the config store at all.
"@type": update
object: BlobStore
value:
  "@type": S3
  bucket: stalwart
  region:
    "@type": Custom
    customEndpoint: http://seaweedfs-all-in-one.seaweedfs:8333
    customRegion: us-east-1
  accessKey: ${STALWART_S3_ACCESS_KEY}
  secretKey:
    "@type": EnvironmentVariable
    variableName: STALWART_S3_SECRET_KEY
  # Read back each object after writing it. Costs an extra GET per message but
  # catches a silently failing object store before the data is acknowledged.
  verifyAfterWrite: true
  timeout: 30000
  maxRetries: 3

---
# -----------------------------------------------------------------------------
# 6. Full-text search
# -----------------------------------------------------------------------------
# `Default` indexes into the data store. Elasticsearch and Meilisearch are the
# alternatives, and neither is deployed in this cluster — stated explicitly so
# the choice is visible rather than implied.
"@type": update
object: SearchStore
value:
  "@type": Default

---
# -----------------------------------------------------------------------------
# 7. Retention and housekeeping
# -----------------------------------------------------------------------------
# Traces and metrics accumulate in Postgres, so these are trimmed well below the
# defaults (90d metrics / 30d traces). Message retention is left at the defaults
# because shortening it silently deletes user mail.
"@type": update
object: DataRetention
value:
  holdTracesFor: 604800000 # 7d  (default 30d)
  holdMetricsFor: 2592000000 # 30d (default 90d)
  holdMtaReportsFor: 1209600000 # 14d (default 30d)
  expungeTrashAfter: 2592000000 # 30d (default)
  expungeSubmissionsAfter: 259200000 # 3d  (default)

---
# -----------------------------------------------------------------------------
# 8. Spam filtering
# -----------------------------------------------------------------------------
# Tag-only on purpose: scoreReject and scoreDiscard stay at 0 so nothing is ever
# refused or silently dropped on score alone. Mail lands in the mailbox with a
# spam tag and Sieve/user rules decide from there. Raise these only once you
# have real corpus data — a reject threshold that is too low loses mail with no
# bounce and no copy.
"@type": update
object: SpamSettings
value:
  enable: true
  scoreSpam: 5
  scoreReject: 0
  scoreDiscard: 0
  trustReplies: true
  trustContacts: true
