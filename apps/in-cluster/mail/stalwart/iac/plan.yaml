# Source of truth for Stalwart's configuration, rendered to NDJSON and applied
# by job.yaml. See README.md.

"@type": upsert
object: Domain
matchOn:
  - name
value:
  dom-lab:
    name: lab.com
    description: Primary lab mail domain
    # `aliases` is omitted, not empty: it is a schema `set`, so [] is rejected.
    certificateManagement:
      "@type": Manual
    dkimManagement:
      "@type": Automatic
    dnsManagement:
      "@type": Manual
    subAddressing:
      "@type": Enabled
    allowRelaying: false

---
"@type": upsert
object: Directory
matchOn:
  - description
value:
  dir-keycloak:
    "@type": Oidc
    description: Keycloak (lab realm)
    issuerUrl: https://sso.lab.com/realms/lab
    # Must match the `stalwart-audience` mapper on the Keycloak `bulwark`
    # client — Keycloak puts the client in `azp`, not `aud`.
    requireAudience: stalwart
    requireScopes:
      openid: true
      email: true
      profile: true
    claimUsername: preferred_username
    usernameDomain: lab.com
    claimName: name
    claimGroups: groups

---
"@type": update
object: Authentication
value:
  directoryId: "#dir-keycloak"

---
# CORS is owned by the ingress annotations; enabling it here too emits
# duplicate Allow-Origin headers, which browsers reject.
"@type": update
object: Http
value:
  usePermissiveCors: false
  useXForwarded: true

---
# accessKey cannot hold a secret reference, so yq substitutes it at render time.
"@type": update
object: BlobStore
value:
  "@type": S3
  bucket: stalwart
  region:
    "@type": Custom
    customEndpoint: http://seaweedfs-all-in-one.seaweedfs:8333
    customRegion: us-east-1
  accessKey: ${STALWART_S3_ACCESS_KEY}
  secretKey:
    "@type": EnvironmentVariable
    variableName: STALWART_S3_SECRET_KEY
  verifyAfterWrite: true
  timeout: 30000
  maxRetries: 3

---
"@type": update
object: SearchStore
value:
  "@type": Default

---
"@type": update
object: DataRetention
value:
  holdTracesFor: 604800000 # 7d  (default 30d)
  holdMetricsFor: 2592000000 # 30d (default 90d)
  holdMtaReportsFor: 1209600000 # 14d (default 30d)
  expungeTrashAfter: 2592000000 # 30d (default)
  expungeSubmissionsAfter: 259200000 # 3d  (default)

---
# Tag-only: scoreReject/scoreDiscard stay 0 so nothing is refused or dropped on
# score alone.
"@type": update
object: SpamSettings
value:
  enable: true
  scoreSpam: 5
  scoreReject: 0
  scoreDiscard: 0
  trustReplies: true
  trustContacts: true
