apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-apply
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  template:
    metadata:
      annotations:
        inject-certs: "enabled"
    spec:
      restartPolicy: OnFailure
      # The yq image runs non-root; without fsGroup the emptyDir is root-owned
      # and the conversion fails on write.
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: render-plan
          image: docker.io/mikefarah/yq:4.53.3
          command:
            - /bin/sh
            - -c
          args:
            # The guard is deliberate: an unset variable expands to empty and
            # would silently write a broken blob-store config.
            - |
              set -eu
              : "${STALWART_S3_ACCESS_KEY:?missing S3 access key}"
              yq -o=json -I=0 '(.. | select(tag == "!!str")) |= envsubst' \
                /src/plan.yaml > /plan/plan.ndjson
          env:
            - name: STALWART_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: stalwart-s3
                  key: access-key
          volumeMounts:
            - name: src
              mountPath: /src
              readOnly: true
            - name: plan
              mountPath: /plan
      containers:
        - name: stalwart-cli
          image: ghcr.io/stalwartlabs/cli:1.0.12
          args:
            - apply
            - --file
            - /plan/plan.ndjson
          env:
            - name: STALWART_URL
              value: http://stalwart-stalwart-mail-ha-http.stalwart.svc:8080
            - name: STALWART_USER
              value: admin
            # The recovery admin, which stays valid once SSO owns normal logins
            # — that is what keeps this plan appliable.
            - name: STALWART_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-admin
                  key: password
          volumeMounts:
            - name: plan
              mountPath: /plan
              readOnly: true
      volumes:
        - name: src
          configMap:
            name: stalwart-plan
        - name: plan
          emptyDir: {}
