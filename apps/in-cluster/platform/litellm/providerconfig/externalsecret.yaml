# The master key in the tfvars shape the ProviderConfig mounts. Terraform
# authenticates as proxy admin; creating models and teams is admin-only.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: litellm-tf
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: litellm-tf
    template:
      engineVersion: v2
      data:
        credentials: |
          {
            "litellm_api_key": "{{ .masterkey }}"
          }
  data:
    - secretKey: masterkey
      remoteRef:
        key: platform/litellm/masterkey
        property: masterkey
