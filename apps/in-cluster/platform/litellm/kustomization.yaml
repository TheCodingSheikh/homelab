apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: litellm

resources:
  - chart
  - valkey
  - providerconfig
  - terraformrc.yaml

# Hash-suffixed, so editing the callback rolls the ConfigMap and restarts the
# proxy. Kustomize rewrites the volume reference the chart renders, so this name
# must match the one in chart/values.yaml.
configMapGenerator:
  - name: litellm-concurrency-limiter
    files:
      - model_concurrency_limiter.py
